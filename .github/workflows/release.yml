name: Release quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/final-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests, production build, and full-stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm --prefix client run lint
      - run: npm --prefix client run test:report
      - run: npm run build
      - name: Run Cypress against an isolated MongoDB database
        run: npm run test:e2e
        env:
          TEST_MONGO_URL: mongodb://127.0.0.1:27017
      - name: Keep test results, screenshots, and recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 14
